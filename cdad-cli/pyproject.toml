[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdad-cli"
version = "0.1.0"
description = "Contract-Driven AI Development CLI - Agnostic orchestrator for CDAD workflow"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "CDAD Contributors"}]

dependencies = [
    "typer[all]==0.9.0",
    "click<8.2",
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "markdown-it-py==3.0.0",
    "python-frontmatter==1.0.0",
    "toml==0.10.2",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.0",
    "pytest-cov==4.1.0",
    "pytest-asyncio==0.21.0",
    "black==23.7.0",
    "ruff==0.1.0",
    "mypy==1.4.0",
    "pytest-mock==3.11.1",
]

[project.scripts]
cdad = "cdad.cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/cdad --cov-report=term -m 'not integration'"
pythonpath = ["src"]
markers = [
    "integration: integration tests that require external dependencies (opt-in with -m integration)",
]
